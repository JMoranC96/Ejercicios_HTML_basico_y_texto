  <title>Ejercicio poema</title>

<body>

  <blockquote>
    "Si, repite la hormiga,<br>
    he visto las estrellas.<br>
    subi al arbol mas alto<br>
    que tiene la alameda<br>
    y vi miles de ojos<br>
    dentro de mis tinieblas."
  </blockquote>

  <p>Extracto del poema <b><i>Los encuentros de un caracol aventurero</i></b>, de Federico Garcia Lorca.</p>
